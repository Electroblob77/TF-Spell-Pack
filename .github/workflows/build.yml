name: Build Mod

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - LICENSE
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Load Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Build
        run: chmod +x gradlew

      # gradle.properties pins org.gradle.java.home to a local Windows path, so override it with the CI JDK
      - name: Build
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME" --max-workers=1

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/libs/*.jar
